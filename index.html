<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8B5CF6">
    <meta name="description" content="Recordatorios de oración personalizados basados en tus emociones">
    <title>Maná Digital</title>
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Tailwind CSS -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.0/dist/tailwind.min.css" rel="stylesheet"> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
    
    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .glassmorphism { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .dark .glassmorphism { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide-in { animation: slideIn 0.3s ease-out; }
        .spinner { border: 3px solid rgba(139,92,246,0.3); border-top-color: #8B5CF6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Configuración de API
        const API_BASE = '/api';
        
        // Servicio de API
        const api = {
            call: async (endpoint, method = 'GET', body = null, token = null) => {
                const headers = { 'Content-Type': 'application/json' };
                if (token) headers['Authorization'] = `Bearer ${token}`;

                const options = { method, headers };
                if (body && method !== 'GET') options.body = JSON.stringify(body);

                const response = await fetch(`${API_BASE}${endpoint}`, options);
                return response.json();
            }
        };

        // Constante para el versículo de notificación pendiente
        const NOTIFICATION_VERSE_KEY = 'pending_notification_verse';

        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker registrado:', registration.scope);
                })
                .catch(error => {
                    console.error('❌ Error registrando Service Worker:', error);
                });
        }
        
        // Traducciones
        const translations = {
            es: {
                login: 'Iniciar Sesión',
                register: 'Registrarse',
                name: 'Nombre',
                email: 'Email',
                password: 'Contraseña',
                noAccount: '¿No tienes cuenta? Regístrate',
                hasAccount: '¿Ya tienes cuenta? Inicia sesión',
                home: 'Inicio',
                history: 'Historial',
                stats: 'Estadísticas',
                favorites: 'Favoritos',
                settings: 'Ajustes',
                logout: 'Cerrar Sesión',
                howFeeling: '¿Cómo te sientes hoy?',
                skip: 'Saltar',
                submit: 'Enviar',
                notes: 'Notas opcionales',
                newVerse: 'Nuevo Versículo',
                noVerse: 'Toca para obtener un versículo',
                noHistory: 'Aún no hay historial',
                noFavorites: 'Aún no tienes favoritos',
                darkMode: 'Modo Oscuro',
                language: 'Idioma',
                save: 'Guardar',
                emotionalJourney: 'Tu Camino Emocional',
                checkinsLast30Days: 'Check-ins (últimos 30 días)',
                currentStreak: 'Racha Actual',
                days: 'días',
                loading: 'Cargando...'
            },
            en: {
                login: 'Login',
                register: 'Register',
                name: 'Name',
                email: 'Email',
                password: 'Password',
                noAccount: "Don't have an account? Register",
                hasAccount: 'Already have an account? Login',
                home: 'Home',
                history: 'History',
                stats: 'Statistics',
                favorites: 'Favorites',
                settings: 'Settings',
                logout: 'Logout',
                howFeeling: 'How are you feeling today?',
                skip: 'Skip',
                submit: 'Submit',
                notes: 'Optional notes',
                newVerse: 'New Verse',
                noVerse: 'Tap to get a verse',
                noHistory: 'No history yet',
                noFavorites: 'No favorites yet',
                darkMode: 'Dark Mode',
                language: 'Language',
                save: 'Save',
                emotionalJourney: 'Your Emotional Journey',
                checkinsLast30Days: 'Check-ins (last 30 days)',
                currentStreak: 'Current Streak',
                days: 'days',
                loading: 'Loading...'
            }
        };
        
        // Componente Principal
        const App = () => {
            const [token, setToken] = useState(localStorage.getItem('prayer_token'));
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [settings, setSettings] = useState({ language: 'es', dark_mode: false });
            const [view, setView] = useState('home');
            
            // Agregar después de los otros useEffect en MainApp
            // Optimizar iconos
            // Inicializar iconos de forma optimizada
            useEffect(() => {
                // Primera inicialización inmediata
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
                
                // Luego cada 2 segundos (más lento que antes pero suficiente)
                const interval = setInterval(() => {
                    if (typeof lucide !== 'undefined') {
                        lucide.createIcons();
                    }
                }, 2000); // Cada 2 segundos en vez de 1
                
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (token) {
                    api.call('/auth.php?action=verify', 'GET', null, token)
                        .then(res => {
                            console.log('Verify response:', res); // Debug
                            if (res.success && res.user) {
                                setUser(res.user);
                                loadSettings();
                            } else {
                                console.error('Token inválido, limpiando...'); // Debug
                                localStorage.removeItem('prayer_token');
                                setToken(null);
                                setUser(null);
                            }
                            setLoading(false);
                        })
                        .catch((error) => {
                            console.error('Error verificando token:', error); // Debug
                            localStorage.removeItem('prayer_token');
                            setToken(null);
                            setUser(null);
                            setLoading(false);
                        });
                } else {
                    setLoading(false);
                }
            }, [token]);
            
            const loadSettings = async () => {
                const res = await api.call('/settings.php?action=get', 'GET', null, token);
                if (res.success) setSettings(res.settings);
            };
            
            const handleAuth = async (isLogin, data) => {
                const action = isLogin ? 'login' : 'register';
                const res = await api.call(`/auth.php?action=${action}`, 'POST', data);
                if (res.success) {
                    setToken(res.token);
                    setUser(res.user);
                    localStorage.setItem('prayer_token', res.token);
                }
                return res;
            };
            
            const handleLogout = () => {
                localStorage.removeItem('prayer_token');
                setToken(null);
                setUser(null);
            };
            
            useEffect(() => { lucide.createIcons(); });
            
            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100 flex items-center justify-center">
                        <div className="spinner"></div>
                    </div>
                );
            }
            
            if (!token) {
                return <AuthScreen onAuth={handleAuth} lang={settings.language} />;
            }
            
            return (
                <MainApp 
                    user={user}
                    token={token}
                    settings={settings}
                    onLogout={handleLogout}
                    view={view}
                    setView={setView}
                    onSettingsUpdate={setSettings}
                />
            );
        };
        
        // Pantalla de Autenticación
        const AuthScreen = ({ onAuth, lang }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const t = translations[lang];
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                
                const data = isLogin ? { email, password } : { name, email, password };
                const res = await onAuth(isLogin, data);
                
                if (!res.success) {
                    setError(res.error || 'Error occurred');
                }
                setLoading(false);
            };
            
            return (
                <div className="min-h-screen bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500 flex items-center justify-center p-4">
                    <div className="w-full max-w-md glassmorphism rounded-3xl p-8 shadow-2xl animate-slide-in">
                        <div className="text-center mb-8">
                            <div className="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                                <i data-lucide="book-open" className="w-10 h-10 text-purple-600"></i>
                            </div>
                            <h1 className="text-3xl font-bold text-white mb-2">Maná Digital</h1>
                            <p className="text-white/80">Tu compañero de oración personalizado</p>
                        </div>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <input
                                    type="text"
                                    placeholder={t.name}
                                    value={name}
                                    onChange={(e) => setName(e.target.value)}
                                    required
                                    className="w-full p-4 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50"
                                />
                            )}
                            
                            <input
                                type="email"
                                placeholder={t.email}
                                value={email}
                                onChange={(e) => setEmail(e.target.value)}
                                required
                                className="w-full p-4 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50"
                            />
                            
                            <input
                                type="password"
                                placeholder={t.password}
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                required
                                className="w-full p-4 rounded-xl bg-white/20 border border-white/30 text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-white/50"
                            />
                            
                            {error && (
                                <div className="bg-red-500/20 border border-red-500/50 text-white p-3 rounded-xl text-sm">
                                    {error}
                                </div>
                            )}
                            
                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-white text-purple-600 p-4 rounded-xl font-bold hover:bg-white/90 transition-all disabled:opacity-50"
                            >
                                {loading ? t.loading : (isLogin ? t.login : t.register)}
                            </button>
                        </form>
                        
                        <div className="mt-6 text-center">
                            <button
                                onClick={() => {
                                    setIsLogin(!isLogin);
                                    setError('');
                                }}
                                className="text-white/80 hover:text-white transition-colors"
                            >
                                {isLogin ? t.noAccount : t.hasAccount}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };
        
        const MainApp = ({ user, token, settings, onLogout, view, setView, onSettingsUpdate }) => {
            const [showCheckin, setShowCheckin] = useState(false);
            const [todayCheckin, setTodayCheckin] = useState(null);
            const [currentVerse, setCurrentVerse] = useState(null);
            const [currentStory, setCurrentStory] = useState(null);
            const [contentType, setContentType] = useState('verse'); // 'verse' o 'story'
            const [emotions, setEmotions] = useState([]);
            const [loading, setLoading] = useState(true);
            const [favoritedVerses, setFavoritedVerses] = useState([]);
            const [emotionsCached, setEmotionsCached] = useState(false);
            const dark = settings.dark_mode;
            const lang = settings.language || 'es';
            const t = translations[lang];
            
            useEffect(() => {
                loadData();
            }, []);

            // Escuchar mensajes del Service Worker
            useEffect(() => {
                const handleSWMessage = (event) => {
                    const { type, verse } = event.data;

                    if (type === 'SHOW_NOTIFICATION_VERSE' && verse) {
                        console.log('📬 Versículo recibido desde notificación:', verse);
                        setCurrentVerse(verse);
                        // Limpiar el versículo pendiente
                        localStorage.removeItem(NOTIFICATION_VERSE_KEY);
                    }

                    if (type === 'SAVE_NOTIFICATION_VERSE' && verse) {
                        console.log('💾 Guardando versículo de notificación:', verse);
                        localStorage.setItem(NOTIFICATION_VERSE_KEY, JSON.stringify(verse));
                    }
                };

                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.addEventListener('message', handleSWMessage);
                }

                // Verificar si hay un versículo pendiente de una notificación
                const pendingVerse = localStorage.getItem(NOTIFICATION_VERSE_KEY);
                if (pendingVerse) {
                    try {
                        const verse = JSON.parse(pendingVerse);
                        console.log('📖 Cargando versículo pendiente:', verse);
                        setCurrentVerse(verse);
                        localStorage.removeItem(NOTIFICATION_VERSE_KEY);
                    } catch (e) {
                        console.error('Error parsing pending verse:', e);
                        localStorage.removeItem(NOTIFICATION_VERSE_KEY);
                    }
                }

                return () => {
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.removeEventListener('message', handleSWMessage);
                    }
                };
            }, []);

            const loadData = async () => {
                try {
                    console.log('⚡ Loading data...');
                    setLoading(true);
                    
                    // Cargar emociones SOLO si no están en caché
                    let emotionsPromise;
                    if (!emotionsCached || emotions.length === 0) {
                        console.log('📥 Cargando emociones desde API...');
                        emotionsPromise = api.call('/checkin.php?action=emotions', 'GET', null, token);
                    } else {
                        console.log('⚡ Usando emociones del caché');
                        emotionsPromise = Promise.resolve({ success: true, emotions });
                    }
                    
                    // Checkin siempre se carga (puede cambiar)
                    const checkinPromise = api.call('/checkin.php?action=today', 'GET', null, token);
                    
                    const [emotionsRes, checkinRes] = await Promise.all([
                        emotionsPromise,
                        checkinPromise
                    ]);
                    
                    if (emotionsRes.success && emotionsRes.emotions) {
                        setEmotions(emotionsRes.emotions);
                        setEmotionsCached(true);
                    }
                    
                    if (checkinRes.success) {
                        setTodayCheckin(checkinRes.checkin);
                        
                        if (!checkinRes.has_checkin) {
                            setShowCheckin(true);
                        } else {
                            await loadVerse();
                        }
                    }
                    
                    // Cargar favoritos (solo una vez)
                    if (favoritedVerses.length === 0) {
                        await loadFavorites();
                    }
                    
                } catch (error) {
                    console.error('Error loading data:', error);
                } finally {
                    setLoading(false);
                }
            };

            const loadFavorites = async () => {
                try {
                    const res = await api.call('/favorites.php?action=list', 'GET', null, token);
                    if (res.success && res.favorites) {
                        // Guardar solo los IDs
                        const ids = res.favorites.map(f => parseInt(f.verse_id));
                        setFavoritedVerses(ids);
                        console.log('✅ Favoritos cargados:', ids);
                    }
                } catch (error) {
                    console.error('Error loading favorites:', error);
                }
            };

            const toggleFavorite = async (verseId) => {
                try {
                    const isFavorited = favoritedVerses.includes(verseId);
                    
                    if (isFavorited) {
                        // Remover
                        const res = await api.call(`/favorites.php?action=remove&verse_id=${verseId}`, 'DELETE', null, token);
                        if (res.success) {
                            setFavoritedVerses(prev => prev.filter(id => id !== verseId));
                            console.log('✅ Favorito removido');
                        }
                    } else {
                        // Agregar
                        const res = await api.call('/favorites.php?action=add', 'POST', { verse_id: verseId }, token);
                        if (res.success) {
                            setFavoritedVerses(prev => [...prev, verseId]);
                            console.log('✅ Favorito agregado');
                        }
                    }
                } catch (error) {
                    console.error('Error toggling favorite:', error);
                }
            };
            
            const loadVerse = async (forceNew = false) => {
                try {
                    // Si no se fuerza nuevo, verificar si hay versículo pendiente de notificación
                    if (!forceNew) {
                        const pendingVerse = localStorage.getItem(NOTIFICATION_VERSE_KEY);
                        if (pendingVerse) {
                            try {
                                const verse = JSON.parse(pendingVerse);
                                console.log('📖 Cargando versículo de notificación:', verse);
                                setCurrentVerse(verse);
                                localStorage.removeItem(NOTIFICATION_VERSE_KEY);
                                return; // No llamar a la API
                            } catch (e) {
                                console.error('Error parsing pending verse:', e);
                                localStorage.removeItem(NOTIFICATION_VERSE_KEY);
                            }
                        }
                    }

                    console.log('🔵 Cargando versículo desde API...');
                    const res = await api.call('/verses.php?action=personalized', 'GET', null, token);
                    console.log('🔵 Respuesta:', res);

                    if (res && res.success && res.verse) {
                        console.log('✅ Versículo recibido:', res.verse);
                        setCurrentVerse(res.verse);
                    } else {
                        console.warn('⚠️ No se recibió versículo válido');
                        // Forzar un versículo de ejemplo para que no se quede en blanco
                        setCurrentVerse({
                            id: 1,
                            reference: 'Juan 3:16',
                            text_es: 'Porque de tal manera amó Dios al mundo...',
                            text_en: 'For God so loved the world...'
                        });
                    }
                } catch (error) {
                    console.error('❌ Error cargando versículo:', error);
                }
            };

            const loadStory = async () => {
                try {
                    console.log('📖 Cargando relato bíblico...');
                    const res = await api.call('/stories.php?action=personalized', 'GET', null, token);

                    if (res && res.success && res.story) {
                        console.log('✅ Relato recibido:', res.story);
                        setCurrentStory(res.story);
                    } else {
                        console.warn('⚠️ No se recibió relato válido');
                        setCurrentStory(null);
                    }
                } catch (error) {
                    console.error('❌ Error cargando relato:', error);
                }
            };

            const toggleContentType = () => {
                const newType = contentType === 'verse' ? 'story' : 'verse';
                setContentType(newType);
                // Siempre cargar contenido fresco al cambiar de modo
                if (newType === 'story') {
                    loadStory();
                } else {
                    loadVerse(true);
                }
            };

            const handleCheckin = async (emotionId, notes, contentPref = 'verse') => {
                try {
                    const res = await api.call('/checkin.php?action=create', 'POST', { emotion_id: emotionId, notes }, token);

                    if (res.success) {
                        // 1. Cerrar modal INMEDIATAMENTE
                        setShowCheckin(false);

                        // 2. Establecer el tipo de contenido preferido
                        setContentType(contentPref);

                        // 3. Recargar data y contenido según preferencia
                        setTimeout(async () => {
                            await loadData();
                            if (contentPref === 'story') {
                                loadStory();
                            } else {
                                loadVerse(true); // forzar nuevo versículo
                            }
                        }, 200);
                    }
                } catch (error) {
                    console.error('❌ Error:', error);
                    setShowCheckin(false);
                }
            };
                                    
            // Mostrar loading mientras carga
            if (loading) {
                return (
                    <div className={`min-h-screen ${dark ? 'dark bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900' : 'bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100'} flex items-center justify-center`}>
                        <div className="spinner"></div>
                    </div>
                );
            }
            
            return (
                <div className={`min-h-screen ${dark ? 'dark bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900' : 'bg-gradient-to-br from-purple-100 via-pink-50 to-blue-100'} transition-all duration-500`}>
                    <NotificationService token={token} settings={settings} currentVerse={currentVerse} />
                    {showCheckin && emotions.length > 0 && (
                        <CheckinModal
                            emotions={emotions}
                            lang={lang}
                            dark={dark}
                            onSubmit={handleCheckin}
                            onSkip={() => {
                                setShowCheckin(false);
                                loadVerse();
                            }}
                        />
                    )}
                    
                    <Header user={user} dark={dark} onLogout={onLogout} settings={settings} token={token} onUpdate={onSettingsUpdate} t={t} />
                    
                    <div className="max-w-4xl mx-auto px-4 py-6 pb-24">
                        {view === 'home' && <HomeView token={token} dark={dark} lang={lang} verse={currentVerse} story={currentStory} contentType={contentType} checkin={todayCheckin} onRefresh={contentType === 'verse' ? loadVerse : loadStory} onToggleContent={toggleContentType} onShowCheckin={() => setShowCheckin(true)} t={t} favoritedVerses={favoritedVerses} onToggleFavorite={toggleFavorite} />}
                        {view === 'history' && <HistoryView token={token} dark={dark} lang={lang} t={t} />}
                        {view === 'stats' && <StatsView token={token} dark={dark} lang={lang} t={t} />}
                        {view === 'favorites' && <FavoritesView token={token} dark={dark} lang={lang} t={t} />}
                    </div>
                    
                    <BottomNav view={view} setView={setView} dark={dark} t={t} />
                </div>
            );
        };
        
        // Componente Header
        const Header = ({ user, dark, onLogout, settings, token, onUpdate, t }) => {
            const [showSettings, setShowSettings] = useState(false);
            
            // Validación de seguridad
            if (!user) {
                return (
                    <div className={`${dark ? 'bg-black/30' : 'bg-white/30'} backdrop-blur-md border-b ${dark ? 'border-purple-500/20' : 'border-purple-200'}`}>
                        <div className="max-w-4xl mx-auto px-4 py-4">
                            <div className="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg">
                                <i data-lucide="book-open" className="w-6 h-6 text-white"></i>
                            </div>
                        </div>
                    </div>
                );
            }
            return (
                <>
                    <div className={`${dark ? 'bg-black/30' : 'bg-white/30'} backdrop-blur-md border-b ${dark ? 'border-purple-500/20' : 'border-purple-200'}`}>
                        <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg">
                                    <i data-lucide="book-open" className="w-6 h-6 text-white"></i>
                                </div>
                                <div>
                                    <h1 className={`text-xl font-bold ${dark ? 'text-white' : 'text-gray-800'}`}>Maná Digital</h1>
                                    <p className={`text-sm ${dark ? 'text-gray-400' : 'text-gray-600'}`}>{user.name}</p>
                                </div>
                            </div>
                            <button
                                onClick={() => setShowSettings(true)}
                                className={`p-3 rounded-xl ${dark ? 'bg-white/10 text-white' : 'bg-purple-100 text-purple-700'} hover:scale-110 transition-all`}
                            >

                                                <div className="flex gap-2 mb-3">

        };

        // Servicio de Notificaciones
            const NotificationService = ({ token, settings, currentVerse }) => {
                const [permission, setPermission] = useState(Notification.permission);
                const [lastNotification, setLastNotification] = useState(null);
                const lastNotifiedTimeRef = useRef(null); // Para evitar notificaciones duplicadas

                // Función auxiliar para enviar notificación y guardar versículo
                const sendVerseNotification = async (verse, source = 'manual') => {
                    const text = settings.language === 'es' ? verse.text_es : verse.text_en;

                    // Guardar versículo en localStorage ANTES de enviar la notificación
                    localStorage.setItem(NOTIFICATION_VERSE_KEY, JSON.stringify(verse));
                    console.log('💾 Versículo guardado para notificación:', verse.reference);

                    // Intentar usar Service Worker si está disponible
                    if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                        navigator.serviceWorker.controller.postMessage({
                            type: 'SHOW_NOTIFICATION',
                            data: {
                                title: 'Recordatorio de Oración',
                                body: `${verse.reference}\n\n${text.substring(0, 100)}...`,
                                verse: verse,
                                tag: 'prayer-reminder'
                            }
                        });
                        console.log('✅ Notificación enviada via SW (' + source + ')');
                    } else {
                        // Fallback: usar Web Notification API directamente
                        const notification = new Notification('Recordatorio de Oración', {
                            body: `${verse.reference}\n\n${text.substring(0, 100)}...`,
                            icon: '/icon-192.png',
                            badge: '/icon-192.png',
                            tag: 'prayer-reminder',
                            requireInteraction: false,
                            data: { verse: verse }
                        });

                        // Manejar clic en la notificación
                        notification.onclick = () => {
                            window.focus();
                            notification.close();
                        };

                        console.log('✅ Notificación enviada directamente (' + source + ')');
                    }

                    setLastNotification(new Date().toISOString());
                };

                // Solicitar permisos
                useEffect(() => {
                    if (settings.notifications_enabled && permission === 'default') {
                        Notification.requestPermission().then(perm => {
                            setPermission(perm);
                            console.log('🔔 Permiso de notificaciones:', perm);
                        });
                    }
                }, [settings.notifications_enabled]);

                // Sistema de notificaciones por intervalo
                useEffect(() => {
                    if (!settings.notifications_enabled || settings.notifications_paused || permission !== 'granted') {
                        return;
                    }

                    if (settings.interval_mode) {
                        const hours = settings.interval_hours || 2;
                        const intervalMs = hours * 60 * 60 * 1000;

                        console.log(`⏰ Notificaciones cada ${hours} hora(s)`);

                        const sendNotification = async () => {
                            try {
                                const res = await api.call('/verses.php?action=personalized', 'GET', null, token);

                                if (res.success && res.verse) {
                                    await sendVerseNotification(res.verse, 'intervalo');
                                }
                            } catch (error) {
                                console.error('Error sending notification:', error);
                            }
                        };

                        // Primera notificación después de 1 minuto (para testing)
                        const firstTimeout = setTimeout(sendNotification, 60000);

                        // Luego cada X horas
                        const interval = setInterval(sendNotification, intervalMs);

                        return () => {
                            clearTimeout(firstTimeout);
                            clearInterval(interval);
                        };
                    }
                }, [settings, permission, token]);

                // Sistema de notificaciones por horarios
                useEffect(() => {
                    if (!settings.notifications_enabled || settings.notifications_paused || permission !== 'granted') {
                        return;
                    }

                    if (!settings.interval_mode) {
                        const checkSchedules = async () => {
                            const now = new Date();
                            const currentTime = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

                            // Evitar notificaciones duplicadas en el mismo minuto
                            if (lastNotifiedTimeRef.current === currentTime) {
                                return;
                            }

                            // Obtener horarios del servidor
                            const res = await api.call('/settings.php?action=get', 'GET', null, token);

                            if (res.success && res.schedules) {
                                for (const schedule of res.schedules) {
                                    const scheduleTime = schedule.time.substring(0, 5);

                                    if (scheduleTime === currentTime) {
                                        try {
                                            const verseRes = await api.call('/verses.php?action=personalized', 'GET', null, token);

                                            if (verseRes.success && verseRes.verse) {
                                                await sendVerseNotification(verseRes.verse, 'horario ' + scheduleTime);
                                                lastNotifiedTimeRef.current = currentTime;
                                            }
                                        } catch (error) {
                                            console.error('Error sending scheduled notification:', error);
                                        }
                                        break; // Solo enviar una notificación por verificación
                                    }
                                }
                            }
                        };

                        // Verificar cada minuto
                        const interval = setInterval(checkSchedules, 60000);

                        // Verificar inmediatamente
                        checkSchedules();

                        return () => clearInterval(interval);
                    }
                }, [settings, permission, token]);

                // Notificación de check-in diario
                useEffect(() => {
                    if (!settings.notifications_enabled || !settings.checkin_notification || permission !== 'granted') {
                        return;
                    }

                    const checkDailyReminder = async () => {
                        const now = new Date();
                        const hour = now.getHours();
                        const minute = now.getMinutes();

                        // Hora del check-in (por defecto 9:00 AM)
                        const checkinTime = settings.checkin_time || '09:00:00';
                        const [checkinHour, checkinMinute] = checkinTime.split(':').map(Number);

                        if (hour === checkinHour && minute === checkinMinute) {
                            // Verificar si ya hizo check-in hoy
                            const res = await api.call('/checkin.php?action=today', 'GET', null, token);

                            if (res.success && !res.has_checkin) {
                                new Notification('Buenos días', {
                                    body: '¿Cómo te sientes hoy? Haz tu check-in emocional',
                                    icon: '/icon-192.png',
                                    badge: '/icon-192.png',
                                    tag: 'daily-checkin',
                                    requireInteraction: true
                                });

                                console.log('✅ Notificación de check-in enviada');
                            }
                        }
                    };

                    // Verificar cada minuto
                    const interval = setInterval(checkDailyReminder, 60000);

                    return () => clearInterval(interval);
                }, [settings, permission, token]);

                return null; // Este componente no renderiza nada
            };
        
        // Navegación Inferior
        const BottomNav = ({ view, setView, dark, t }) => {
            const items = [
                { id: 'home', icon: 'home', label: t.home },
                { id: 'history', icon: 'history', label: t.history },
                { id: 'stats', icon: 'bar-chart-2', label: t.stats },
                { id: 'favorites', icon: 'heart', label: t.favorites }

            return (
                <div className={`fixed bottom-0 left-0 right-0 ${dark ? 'bg-black/30' : 'bg-white/30'} backdrop-blur-md border-t ${dark ? 'border-purple-500/20' : 'border-purple-200'}`}>
                    <div className="max-w-4xl mx-auto px-4 py-3">
                        <div className="flex justify-around">
                            {items.map(item => (
                                <button
                                    key={item.id}
                                    onClick={() => setView(item.id)}

                                >
                                    <i data-lucide={item.icon} className="w-6 h-6"></i>
                                    <span className="text-xs font-semibold">{item.label}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };
        
        // Renderizar la aplicación
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
        
        // Inicializar iconos de Lucide
        setTimeout(() => lucide.createIcons(), 100);
    </script>
